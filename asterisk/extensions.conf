[general]
static=yes
writeprotect=yes

; Thirrjet nga ElevenLabs: lejohen vetem Kosove, France, Gjermani. Maks 5 njekohesisht.
[from-elevenlabs]
exten => _+383X.,1,Goto(out,${EXTEN},1)
exten => _+33X.,1,Goto(out,${EXTEN},1)
exten => _+49X.,1,Goto(out,${EXTEN},1)
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)

[out]
exten => _+X.,1,Set(GROUP()=outbound)
 same => n,GotoIf($[${GROUP_COUNT(outbound)} > 5]?busy)
 same => n,Dial(PJSIP/${EXTEN}@vala,60)
 same => n,Hangup()
 same => n(busy),Hangup(34)

; Thirrjet hyrese ne numrin e Vales: refuzohen (mesazhi i shkurter mund te shtohet me vone)
[from-vala]
exten => _.,1,Hangup(21)
exten => s,1,Hangup(21)
