; END Call Agent: ElevenLabs <-> Asterisk <-> Vala
[global]
type=global
user_agent=END-Call-Agent

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ---------- ElevenLabs (thirrjet dalese vijne nga ElevenLabs me username/password) ----------
[elevenlabs]
type=endpoint
context=from-elevenlabs
disallow=all
allow=alaw,ulaw
auth=elevenlabs-auth
aors=elevenlabs
identify_by=auth_username,username
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[elevenlabs-auth]
type=auth
auth_type=userpass
username=elevenlabs
password=<ruhet vetëm në server: /root/.el_sip_pass>

[elevenlabs]
type=aor
max_contacts=0

